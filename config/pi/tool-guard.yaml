blocked:
  - rm -rf /
  - rm -rf /*
  - sudo rm
  - *:(){ :|:& };:     # fork bomb
  - *| sh
  - *| bash
  - *> /dev/
  - dd if=
  - chmod 777 /
  - chmod 777 ~
  - chown -R
  - git push --force
  - git push -f
  - systemctl disable
  - systemctl mask
